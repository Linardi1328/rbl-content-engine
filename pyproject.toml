[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbl-content-engine"
version = "0.0.0"
description = "Evidence-driven manual content pilot for RBL Productions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "higgsfield-client>=0.1.0,<0.2.0",
    "python-dotenv>=1.0.0,<2.0.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
